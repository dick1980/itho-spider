[project]
name = "home-assistant-itho-spider"
version = "0.4.1"
license = "MIT"
description = "Local Home Assistant control of an Itho Spider through evofw3 USB"
requires-python = ">=3.14"
dependencies = ["serialx>=1.11.0"]

[dependency-groups]
dev = [
  "homeassistant==2026.10.4",
  "pytest-homeassistant-custom-component==0.13.375",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
ignore = ["E501"]
