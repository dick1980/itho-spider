name: Release readiness (does not publish)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/check_publication.py --release
      - run: python scripts/build_release.py --output dist
