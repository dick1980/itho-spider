name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev serialx==1.11.0
      - run: ruff check custom_components tests scripts
      - run: pytest
      - run: python scripts/check_publication.py
      - run: python scripts/build_release.py --output dist --prepared
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match the supported runtime; latest validates unreleased Core dependencies.
      - name: hassfest (Home Assistant 2026.10.4)
        run: docker run --rm -v "${{ github.workspace }}:/github/workspace" ghcr.io/home-assistant/hassfest:2026.10.4
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
