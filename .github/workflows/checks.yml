name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev serialx==1.11.0
      - run: ruff check custom_components tests scripts
      - run: python -m pytest
      - run: python scripts/check_publication.py
      - run: python scripts/build_release.py --output dist --prepared
  hassfest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        home-assistant: ['2026.10.4', 'latest']
    steps:
      - uses: actions/checkout@v4
      # Validate the supported baseline and current upstream requirements.
      - name: hassfest
        run: docker run --rm -v "${{ github.workspace }}:/github/workspace" ghcr.io/home-assistant/hassfest:${{ matrix.home-assistant }}
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
